# @geohotstan/dsh-codex-computer-use bundle patch: the desktop computer-use capability, inserted
# over the profile root. All three rows are host-plane — the engine is a
# singleton desktop controller (publishes ctx.computer), and the tools/policy
# register into the host registries, so every preset in the profile (standard,
# creator/cordis, code) sees the computer_use_* tools.
#
# The rows name THIS package's subpaths (`@geohotstan/dsh-codex-computer-use/*`, resolved through
# the profile's node_modules via the exports map in the root package.json), so
# a single install — `dsh plugin --profile <name> add @geohotstan/dsh-codex-computer-use` from
# npm, or `... add <checkout>` from this repo — brings everything along.
#
# helperPath: the executable inside the bundled, signed daemon app. When
# omitted, the engine falls back to the DSH_COMPUTER_HELPER_PATH environment
# variable. Set it per-machine (build with `pnpm run build:native` first):
#   <checkout>/native/.build/dsh-computer-daemon.app/Contents/MacOS/dsh-computer-daemon

- insert:
    - id: computer-engine
      name: '@geohotstan/dsh-codex-computer-use/computer-local'
      config:
        timeoutMs: 30000

    - id: computer-tools
      name: '@geohotstan/dsh-codex-computer-use/computer-tools'
      config:
        enableScreenshots: true

    - id: computer-policy
      name: '@geohotstan/dsh-codex-computer-use/computer-policy'
      config:
        allowlistApps: []
