# Minimal composition showing the three plugin rows. `dsh plugin add` applies
# the equivalent via the bundle layer in the root `cordis.patch.yml`, whose
# rows name the same `@zibokapi/dsh-codex-computer-use/*` subpaths. `helperPath`
# is optional: after `npx @zibokapi/dsh-codex-computer-use` the engine finds the
# installed daemon on its own; set it only to point at a custom build.
plugins:
  computer-engine:
    plugin: '@zibokapi/dsh-codex-computer-use/computer-local'
  computer-tools:
    plugin: '@zibokapi/dsh-codex-computer-use/computer-tools'
  computer-policy:
    plugin: '@zibokapi/dsh-codex-computer-use/computer-policy'
