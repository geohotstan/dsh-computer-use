name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Tag-triggered npm release: run the full check against published harness
  # packages, then publish the built tarball. `prepare` rebuilds lib/ before
  # packing, so the published artifact is always the current source.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # No `version:` here — the action reads packageManager from package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The runtime test suite boots the macOS-only engine and runs in the CI
      # `native` job; this job re-verifies the static half and publishes.
      - name: Build
        run: pnpm run build

      - name: Check whether this version is already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Skips when the tag points at an already-published version (e.g. a tag
      # pushed after a manual publish), so the job is idempotent.
      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
