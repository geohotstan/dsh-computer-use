name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TypeScript side: depends only on published @deepseek-ai/* packages, so a
  # clean `pnpm install` from npm is the user-facing path (`dsh plugin add`).
  # Tests drive a fake daemon (packages/computer-local/tests/fixtures), so no
  # desktop, macOS permissions, or native build are required.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # Native side: the resident macOS helper daemon (Swift). macOS-only by design.
  # Proves the daemon compiles and its unit tests pass; bundling/signing into
  # the .app is a release step (`pnpm run build:native`) done on a signed host.
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the daemon
        run: swift build -c release --package-path packages/computer-local/native

      - name: Test the daemon
        run: swift test --package-path packages/computer-local/native

  # The documented install path, run for real: `dsh plugin --profile <name> add
  # <checkout>` against the actual CLI. The repo root is the DSH bundle — its
  # patch rows name `dsh-computer-use/*` subpaths, so this job first builds the
  # host libs the exports map points at, then proves the bundle registers as a
  # profile layer, its rows compose, and every row resolves through the linked
  # checkout. Nothing boots the daemon, so Ubuntu suffices.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host libs
        run: pnpm run build

      - name: Install the dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Add the bundle to a scratch profile
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile ci add "$GITHUB_WORKSPACE"
          node -e "
            const d = require('$DSH_HOME/profiles/ci/package.json')
            if (!d.dsh.profile.bundles.includes('dsh-computer-use')) {
              throw new Error('the bundle layer was not registered')
            }
            console.log('bundle layer registered:', d.dsh.profile.bundles.join(', '))
          "

      - name: Compose the profile
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh --profile ci --dump-config > "$RUNNER_TEMP/dump.txt"
          grep -q 'computer-engine' "$RUNNER_TEMP/dump.txt"
          grep -q 'dsh-computer-use/computer-local' "$RUNNER_TEMP/dump.txt"
          grep -q 'computer-tools' "$RUNNER_TEMP/dump.txt"
          grep -q 'dsh-computer-use/computer-policy' "$RUNNER_TEMP/dump.txt"
          echo "composed rows referencing this bundle: $(grep -c 'dsh-computer-use/' "$RUNNER_TEMP/dump.txt")"

      # Every patch row resolves through the linked checkout's exports map to a
      # built lib file — exactly what a profile boot does — and each entry
      # module imports cleanly (its bare dsh/cordis imports resolve through the
      # checkout's workspace install). Plugin export shapes vary: three packages
      # use a default export, computer-tools uses named `apply`.
      - name: Verify every patch row resolves and loads through the installed bundle
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          node --input-type=module -e "
            import { createRequire } from 'node:module'
            import { existsSync } from 'node:fs'
            const req = createRequire(process.env.DSH_HOME + '/profiles/ci/package.json')
            for (const sub of ['computer', 'computer-local', 'computer-tools', 'computer-policy']) {
              const entry = req.resolve('dsh-computer-use/' + sub)
              if (!existsSync(entry)) throw new Error('resolved entry is missing: ' + entry)
              const mod = await import(entry)
              const plugin = mod.default ?? mod.apply
              if (typeof plugin !== 'function') throw new Error(sub + ': neither a default export nor apply()')
              console.log(sub, '->', entry, '(loads)')
            }
          "
