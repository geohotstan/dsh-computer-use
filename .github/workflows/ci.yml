name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Static validation on Linux against PUBLISHED harness packages, with no
  # harness checkout: this is the path a user takes with `dsh plugin add`.
  # Typecheck covers src and tests; the runtime tests cannot run here — the
  # computer-local engine boots only on macOS (it throws a platform gate on
  # construction), so they run in the native job below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `version:` here — the action reads packageManager from
      # package.json; specifying both is an error ("Multiple versions").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  # The macOS side: the resident Swift helper daemon plus the Node test suite.
  # The engine is macOS-only by design (it throws on non-darwin hosts), so the
  # tests that boot it — the executor, settings, and integration stacks over
  # the fake daemon — only make sense here. Bundling/signing into the .app is
  # a release step (`pnpm run build:native`) done on a signed host.
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `version:` here — the action reads packageManager from
      # package.json; specifying both is an error ("Multiple versions").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the daemon
        run: swift build -c release --package-path native

      - name: Test the daemon
        run: swift test --package-path native

      - name: Test (Node)
        run: pnpm test

  # The documented install paths, run for real: `dsh plugin --profile <name>
  # add` against the actual CLI, once from the checkout path (linked, the
  # README's manual form) and once from a packed tarball (the registry form).
  # The package is a DSH bundle whose patch rows name `@zibokapi/dsh-codex-computer-use/*`
  # subpaths, so each chain proves the bundle registers as a profile layer, its
  # rows compose, and every row resolves and loads through the installed
  # package. Nothing boots the daemon, so Ubuntu suffices.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `version:` here — the action reads packageManager from
      # package.json; specifying both is an error ("Multiple versions").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lib
        run: pnpm run build

      - name: Install the dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Add the bundle from the checkout path
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile ci add "$GITHUB_WORKSPACE"
          node -e "
            const d = require('$DSH_HOME/profiles/ci/package.json')
            if (!d.dsh.profile.bundles.includes('@zibokapi/dsh-codex-computer-use')) {
              throw new Error('the bundle layer was not registered')
            }
            console.log('checkout install — bundle layer registered:', d.dsh.profile.bundles.join(', '))
          "

      - name: Add the bundle from a packed tarball
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          pnpm pack --pack-destination "$RUNNER_TEMP"
          dsh plugin --profile citar add "$RUNNER_TEMP"/zibokapi-dsh-codex-computer-use-*.tgz
          node -e "
            const d = require('$DSH_HOME/profiles/citar/package.json')
            if (!d.dsh.profile.bundles.includes('@zibokapi/dsh-codex-computer-use')) {
              throw new Error('the bundle layer was not registered')
            }
            console.log('tarball install — bundle layer registered:', d.dsh.profile.bundles.join(', '))
          "

      - name: Compose both profiles
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh --profile ci --dump-config > "$RUNNER_TEMP/dump.txt"
          dsh --profile citar --dump-config > "$RUNNER_TEMP/dump-citar.txt"
          for dump in "$RUNNER_TEMP/dump.txt" "$RUNNER_TEMP/dump-citar.txt"; do
            grep -q 'computer-engine' "$dump"
            grep -q '@zibokapi/dsh-codex-computer-use/computer-local' "$dump"
            grep -q 'computer-tools' "$dump"
            grep -q '@zibokapi/dsh-codex-computer-use/computer-policy' "$dump"
          done
          echo "composed rows referencing this bundle: $(grep -c '@zibokapi/dsh-codex-computer-use/' "$RUNNER_TEMP/dump.txt")"

      # Every patch row resolves through the installed package's exports map to
      # a built lib file — exactly what a profile boot does — and each entry
      # module imports cleanly (its bare @deepseek-ai/* imports resolve through
      # the profile). Plugin export shapes vary: three entries use a default
      # export, computer-tools uses named `apply`.
      - name: Verify every patch row resolves and loads from both installs
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          for profile in ci citar; do
            echo "--- profile: $profile"
            node --input-type=module -e "
              import { createRequire } from 'node:module'
              import { existsSync } from 'node:fs'
              const profile = process.argv[1]
              const req = createRequire(process.env.DSH_HOME + '/profiles/' + profile + '/package.json')
              for (const sub of ['computer', 'computer-local', 'computer-tools', 'computer-policy']) {
                const entry = req.resolve('@zibokapi/dsh-codex-computer-use/' + sub)
                if (!existsSync(entry)) throw new Error('resolved entry is missing: ' + entry)
                const mod = await import(entry)
                const plugin = mod.default ?? mod.apply
                if (typeof plugin !== 'function') throw new Error(sub + ': neither a default export nor apply()')
                console.log(sub, '->', entry, '(loads)')
              }
            " "$profile"
          done
